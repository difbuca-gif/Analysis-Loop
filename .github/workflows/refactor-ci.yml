name: Refactor CI

# Branch-only safety net for the maintainability refactor. Do not merge automatically.
on:
  push:
    branches:
      - refactor/maintainability
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,api]"

      - name: Compile
        run: python -m compileall -q src tests

      - name: Lint
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ruff check src tests 2>&1 | tee ruff.txt

      - name: Test
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee pytest.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refactor-diagnostics
          path: |
            ruff.txt
            pytest.txt
          if-no-files-found: warn

      - name: Fail on checks
        if: steps.lint.outcome != 'success' || steps.tests.outcome != 'success'
        run: exit 1
